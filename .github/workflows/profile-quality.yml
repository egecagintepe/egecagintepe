name: Profile artwork quality

on:
  push:
    paths:
      - README.md
      - 'assets/**'
      - scripts/check_profile_assets.py
      - .github/workflows/profile-quality.yml
  pull_request:
    paths:
      - README.md
      - 'assets/**'
      - scripts/check_profile_assets.py
      - .github/workflows/profile-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README and SVGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate profile artwork
        run: python scripts/check_profile_assets.py
