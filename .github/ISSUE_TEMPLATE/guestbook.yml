name: Guestbook
description: Leave a note on Ege's profile.
title: "[guestbook] "
labels:
  - guestbook
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by. Short notes, hellos and terrible engineering jokes are welcome.
  - type: textarea
    id: message
    attributes:
      label: Your note
      description: Keep it friendly and public-safe; this issue will be visible on GitHub.
      placeholder: "hello from..."
    validations:
      required: true
