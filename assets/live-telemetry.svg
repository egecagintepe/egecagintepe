<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Live GitHub telemetry</title><desc id="desc">Initial telemetry snapshot; GitHub Actions refreshes this panel automatically.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081018"/><stop offset="1" stop-color="#0d1721"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#68e4ff"/><stop offset=".55" stop-color="#9beeff"/><stop offset="1" stop-color="#718cff"/></linearGradient><style>.m{font-family:"SFMono-Regular",Consolas,monospace}.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{fill:#edf7ff}.mut{fill:#718698}.a{fill:#9beeff}.flow{stroke-dasharray:7 14;animation:f 4s linear infinite}.pulse{animation:p 2.5s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-84}}@keyframes p{0%,100%{opacity:.32}50%{opacity:1}}</style></defs>
<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#bg)" stroke="#b8eaff" stroke-opacity=".13"/>
<text x="38" y="42" class="m mut" font-size="13" letter-spacing="1.6">LIVE TELEMETRY // AUTO-RENDERED FROM PUBLIC GITHUB DATA</text><circle class="pulse" cx="1130" cy="37" r="5" fill="#72efae"/><text x="1143" y="42" class="m" fill="#72efae" font-size="11">SYNC</text>
<text x="38" y="83" class="s w" font-size="27" font-weight="720">Public engineering activity, rendered as a system panel.</text><text x="38" y="108" class="s mut" font-size="14">No third-party stats service. Generated inside this repository by GitHub Actions.</text>
