<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Ege Çağın Tepe — blueprint profile assembly</title>
<desc id="desc">An engineering drawing inspired profile header with real drafting conventions.</desc>
<defs>
  <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#2f7fae" stroke-opacity=".22" stroke-width=".8"/>
  </pattern>
  <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#minor)"/>
    <path d="M100 0H0V100" fill="none" stroke="#65a9cf" stroke-opacity=".3" stroke-width="1.2"/>
  </pattern>
  <filter id="hand" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="8" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
    <path d="M0 0L7 3.5L0 7Z" fill="#dff1fb"/>
  </marker>
  <style>
    .draft{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .draw{filter:url(#hand)}
    .trace{stroke-dasharray:620;stroke-dashoffset:620;animation:draw 3.6s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
</defs>

<rect width="1200" height="500" fill="#07314e"/>
<rect width="1200" height="500" fill="url(#major)"/>
<rect x="20" y="20" width="1160" height="460" fill="none" stroke="#dff1fb" stroke-opacity=".72" stroke-width="1.3"/>

<g class="draw" fill="none" stroke="#dff1fb" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
  <line x1="510" y1="92" x2="510" y2="367" stroke-dasharray="8 10" stroke-opacity=".62"/>
  <line x1="256" y1="230" x2="810" y2="230" stroke-dasharray="8 10" stroke-opacity=".62"/>

  <rect x="430" y="174" width="160" height="112"/>
  <rect x="445" y="160" width="160" height="112" opacity=".48"/>
  <rect x="460" y="146" width="160" height="112" opacity=".24"/>

  <path class="trace" d="M590 204H760V135H870"/>
  <path d="M590 244H725V308H870"/>
  <path d="M430 204H300V132H188"/>
  <path d="M430 250H318V334H188"/>

  <line x1="430" y1="319" x2="590" y2="319" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="430" y1="303" x2="430" y2="335"/>
  <line x1="590" y1="303" x2="590" y2="335"/>
</g>

<g class="draft" fill="#dff1fb">
  <text x="464" y="209" font-size="18" letter-spacing="1.4">EGE ÇAĞIN</text>
  <text x="464" y="237" font-size="18" letter-spacing="1.4">TEPE</text>
  <text x="464" y="260" font-size="10" fill="#7fc4e6">PROFILE ASSEMBLY</text>

  <circle cx="870" cy="135" r="16" fill="none" stroke="#dff1fb"/>
  <text x="870" y="139" font-size="11" text-anchor="middle">01</text>
  <text x="895" y="132" font-size="12">SOFTWARE / WEB</text>
  <text x="895" y="151" font-size="10" fill="#7fc4e6">Django · FastAPI · React · Next.js</text>

  <circle cx="870" cy="308" r="16" fill="none" stroke="#dff1fb"/>
  <text x="870" y="312" font-size="11" text-anchor="middle">02</text>
  <text x="895" y="305" font-size="12">INFRA / DATA</text>
  <text x="895" y="324" font-size="10" fill="#7fc4e6">PostgreSQL · Redis · Docker · Linux</text>

  <circle cx="188" cy="132" r="16" fill="none" stroke="#dff1fb"/>
  <text x="188" y="136" font-size="11" text-anchor="middle">03</text>
  <text x="64" y="129" font-size="12">AI / AUTOMATION</text>
  <text x="64" y="148" font-size="10" fill="#7fc4e6">LangGraph · MCP · agent workflows</text>

  <circle cx="188" cy="334" r="16" fill="none" stroke="#dff1fb"/>
  <text x="188" y="338" font-size="11" text-anchor="middle">04</text>
  <text x="64" y="331" font-size="12">ELECTRICAL / HW</text>
  <text x="64" y="350" font-size="10" fill="#7fc4e6">Embedded · Altium · Proteus</text>

  <text x="510" y="344" font-size="10" text-anchor="middle">160</text>
  <text x="430" y="360" font-size="9" fill="#7fc4e6">NTS / NOT TO SCALE</text>
</g>

<g transform="translate(742 382)" class="draft">
  <rect width="418" height="78" fill="#07314e" stroke="#dff1fb" stroke-width="1.2"/>
  <line x1="0" y1="28" x2="418" y2="28" stroke="#dff1fb"/>
  <line x1="255" y1="28" x2="255" y2="78" stroke="#dff1fb"/>
  <line x1="332" y1="28" x2="332" y2="78" stroke="#dff1fb"/>
  <text x="12" y="19" fill="#dff1fb" font-size="13">MULTIDISCIPLINARY PRACTICE MAP</text>
  <text x="12" y="47" fill="#7fc4e6" font-size="9">DRAWN BY</text>
  <text x="12" y="66" fill="#dff1fb" font-size="11">E. Ç. TEPE</text>
  <text x="267" y="47" fill="#7fc4e6" font-size="9">DWG</text>
  <text x="267" y="66" fill="#dff1fb" font-size="11">ECT-P-01</text>
  <text x="344" y="47" fill="#7fc4e6" font-size="9">REV</text>
  <text x="344" y="66" fill="#dff1fb" font-size="11">03</text>
</g>

<text x="40" y="48" class="draft" fill="#dff1fb" font-size="13" letter-spacing="1.5">ENGINEERING PROFILE / GENERAL ARRANGEMENT</text>
<text x="40" y="70" class="draft" fill="#7fc4e6" font-size="10">SYSTEMS · SOFTWARE · HARDWARE · PRODUCT</text>
</svg>