<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Ege Çağın Tepe — risograph profile poster</title>
<desc id="desc">A two-ink risograph-inspired profile poster with deliberate print misregistration.</desc>
<defs>
  <pattern id="pink90" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
    <circle cx="3.5" cy="3.5" r="3.05" fill="#f0338c"/>
  </pattern>
  <pattern id="blue20" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
    <circle cx="4" cy="4" r="1.45" fill="#1257a8"/>
  </pattern>
  <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .18  0 0 0 0 .13  0 0 0 0 .09  0 0 0 .12 0"/>
  </filter>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .shift{animation:shift 4.5s ease-in-out infinite}
    @keyframes shift{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
  </style>
</defs>

<rect width="1200" height="500" fill="#f4efe3"/>

<g transform="translate(72 70)">
  <text x="4" y="95" class="serif shift" font-size="104" font-weight="700" fill="#1257a8">EGE ÇAĞIN</text>
  <text x="0" y="91" class="serif" font-size="104" font-weight="700" fill="#f0338c">EGE ÇAĞIN</text>

  <text x="4" y="202" class="serif shift" font-size="104" font-weight="700" fill="#1257a8">TEPE</text>
  <text x="0" y="198" class="serif" font-size="104" font-weight="700" fill="#f0338c">TEPE</text>

  <text x="4" y="250" class="mono" font-size="13" fill="#101a2c" letter-spacing="1.4">ELECTRICAL &amp; ELECTRONICS ENGINEERING / SYSTEMS / SOFTWARE / PRODUCT</text>

  <rect x="0" y="282" width="635" height="84" fill="url(#blue20)"/>
  <text x="18" y="313" class="serif" font-size="18" fill="#101a2c">I like systems that cross boundaries.</text>
  <text x="18" y="341" class="serif" font-size="18" fill="#101a2c">Hardware, software, automation, interfaces.</text>
</g>

<circle cx="1008" cy="187" r="132" fill="url(#pink90)"/>
<circle cx="1014" cy="191" r="132" fill="url(#blue20)" opacity=".88"/>

<g class="mono" font-size="11" fill="#101a2c">
  <text x="880" y="375">01  NOVZON</text>
  <text x="880" y="397">02  ZONDPI</text>
  <text x="880" y="419">03  TRIAGE</text>
  <text x="880" y="441">04  PRIVATE WORK</text>
</g>

<g stroke="#101a2c" stroke-width="1">
  <path d="M28 28h22M39 17v22M1150 28h22M1161 17v22M28 472h22M39 461v22M1150 472h22M1161 461v22"/>
</g>

<g transform="translate(72 450)" class="mono" font-size="10">
  <rect width="590" height="12" fill="#f0338c"/>
  <rect x="590" width="160" height="12" fill="#1257a8"/>
  <text x="772" y="10" fill="#101a2c">ED. 03 / ANKARA / 2026</text>
</g>

<rect width="1200" height="500" filter="url(#grain)" opacity=".55" pointer-events="none"/>
</svg>