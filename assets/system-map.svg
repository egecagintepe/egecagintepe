<g transform="translate(-390 250)"><rect width="208" height="80" rx="14" fill="#0C151F" stroke="#A0EAFF" stroke-opacity=".14"/><text x="18" y="30" fill="#A0EAFF" font-size="13" font-weight="700">HARDWARE / EE</text><text x="18" y="54" fill="#74899B" font-size="12">embedded · circuits · power</text></g>
