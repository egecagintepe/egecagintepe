<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Operating Domains</title><desc id="d">Animated topology of Ege's engineering domains.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#091018"/><stop offset="1" stop-color="#0C1520"/></linearGradient>
<linearGradient id="ln"><stop stop-color="#6DE7FF"/><stop offset="1" stop-color="#718FFF"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:"SFMono-Regular",Consolas,monospace}.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.flow{stroke-dasharray:7 15;animation:f 5s linear infinite}.pulse{animation:p 2.7s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-88}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}</style>
</defs>
