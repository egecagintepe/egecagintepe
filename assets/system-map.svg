<text x="38" y="76" class="s" font-size="26" font-weight="700" fill="#EDF7FF">I prefer systems that cross boundaries.</text>

<g transform="translate(600 208)">
<circle r="58" fill="#0B1721" stroke="#A1EDFF" stroke-opacity=".3"/><circle class="pulse" r="8" fill="#A1EDFF" filter="url(#g)"/>
