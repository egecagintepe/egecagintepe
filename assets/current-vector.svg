<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Current engineering vector</title><desc id="d">Animated map showing systems engineering converging software, AI, infrastructure, hardware and product.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081018"/><stop offset="1" stop-color="#0d1721"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop stop-color="#69e5ff"/><stop offset=".55" stop-color="#9beeff"/><stop offset="1" stop-color="#718cff"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:"SFMono-Regular",Consolas,monospace}.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mut{fill:#718698}.w{fill:#edf7ff}.ac{fill:#9beeff}.flow{stroke-dasharray:7 14;animation:f 4.2s linear infinite}.pulse{animation:p 2.6s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-84}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}</style>
</defs>
<rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" stroke="#b8eaff" stroke-opacity=".13"/>
<text x="38" y="42" class="m mut" font-size="13" letter-spacing="1.6">CURRENT VECTOR // CONVERGENCE MODEL</text>
<text x="38" y="78" class="s w" font-size="26" font-weight="720">Multiple disciplines. One operating system.</text>

<g transform="translate(600 196)">
<circle r="55" fill="#0b151e" stroke="#9beeff" stroke-opacity=".26"/>
<circle class="pulse" r="7" fill="#9beeff" filter="url(#g)"/>
<text x="-33" y="-8" class="m ac" font-size="11">SYSTEMS</text><text x="-39" y="10" class="m ac" font-size="11">ENGINEERING</text>

<path class="flow" d="M-54-8L-230-72M-45 33L-235 82M54-8L230-72M45 33L235 82M0-55V-118" fill="none" stroke="url(#a)" stroke-width="2" stroke-opacity=".62"/>

<g class="s">
<g transform="translate(-398 -112)"><rect width="178" height="64" rx="13" fill="#0b151e" stroke="#9beeff" stroke-opacity=".12"/><text x="18" y="27" class="ac" font-size="12" font-weight="700">AI SYSTEMS</text><text x="18" y="47" class="mut" font-size="11">agents · validation</text></g>
<g transform="translate(-406 244)"><rect width="190" height="64" rx="13" fill="#0b151e" stroke="#9beeff" stroke-opacity=".12"/><text x="18" y="27" class="ac" font-size="12" font-weight="700">HARDWARE / EE</text><text x="18" y="47" class="mut" font-size="11">embedded · circuits</text></g>
<g transform="translate(820 -112)"><rect width="178" height="64" rx="13" fill="#0b151e" stroke="#9beeff" stroke-opacity=".12"/><text x="18" y="27" class="ac" font-size="12" font-weight="700">SOFTWARE</text><text x="18" y="47" class="mut" font-size="11">APIs · apps · tools</text></g>
<g transform="translate(812 244)"><rect width="190" height="64" rx="13" fill="#0b151e" stroke="#9beeff" stroke-opacity=".12"/><text x="18" y="27" class="ac" font-size="12" font-weight="700">INFRASTRUCTURE</text><text x="18" y="47" class="mut" font-size="11">data · queues · ops</text></g>
<g transform="translate(508 60)"><rect width="184" height="64" rx="13" fill="#0b151e" stroke="#9beeff" stroke-opacity=".12"/><text x="18" y="27" class="ac" font-size="12" font-weight="700">PRODUCT</text><text x="18" y="47" class="mut" font-size="11">UX · iteration · trust</text></g>
</g>
</g>

<text x="38" y="294" class="m mut" font-size="10">VECTOR: BUILD → OBSERVE → AUTOMATE → HARDEN → SHIP</text>
<text x="947" y="294" class="m mut" font-size="10">MODE: CROSS-DOMAIN</text>
</svg>