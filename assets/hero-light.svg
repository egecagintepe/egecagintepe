<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ege Çağın Tepe — Systems, Software, Hardware</title>
  <desc id="desc">Animated GitHub profile hero panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="0.55" stop-color="#F3F7FA"/>
      <stop offset="1" stop-color="#EDF4F8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C8BAA"/>
      <stop offset="0.5" stop-color="#2DA7C6"/>
      <stop offset="1" stop-color="#4A70C0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#365B78" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill:#5D7184; }
      .bright { fill:#142231; }
      .accent { fill:#167D9D; }
      .scan { animation: scan 7s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .flow { stroke-dasharray: 10 18; animation: flow 4.5s linear infinite; }
      .fade { animation: fade 5s ease-in-out infinite; }
      @keyframes scan { from { transform:translateY(-90px); } to { transform:translateY(500px); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.22); } }
      @keyframes flow { to { stroke-dashoffset:-112; } }
      @keyframes fade { 0%,100% { opacity:.28; } 50% { opacity:.75; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect class="scan" x="0" y="-95" width="1200" height="90" fill="url(#accent)" opacity=".035"/>
    <circle cx="1015" cy="30" r="190" fill="#3AA8CF" opacity=".03"/>
    <circle cx="1080" cy="380" r="250" fill="#5674C8" opacity=".025"/>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#2C6D89" stroke-opacity=".16"/>

  <g class="mono" font-size="14" letter-spacing="1.5">
    <text x="54" y="52" class="muted">ECT / PROFILE SYSTEM</text>
    <circle class="pulse" cx="1048" cy="47" r="5" fill="#1B8A5A" transform-origin="1048px 47px"/>
    <text x="1063" y="52" fill="#1B8A5A">ACTIVE</text>
  </g>

  <g class="sans">
    <text x="54" y="136" class="bright" font-size="55" font-weight="750" letter-spacing="-1.6">EGE ÇAĞIN TEPE</text>
    <text x="56" y="176" class="accent" font-size="18" font-weight="650" letter-spacing="4">SYSTEMS · SOFTWARE · HARDWARE</text>
    <text x="56" y="227" class="muted" font-size="20">
      Electrical &amp; Electronics Engineering student building
    </text>
    <text x="56" y="257" class="muted" font-size="20">
      AI-augmented products, resilient systems and practical engineering tools.
    </text>
  </g>

  <g transform="translate(56 302)">
    <line x1="0" y1="0" x2="1086" y2="0" stroke="#2C6D89" stroke-opacity=".12"/>
    <line class="flow" x1="0" y1="0" x2="1086" y2="0" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".72"/>
    <circle cx="300" cy="0" r="4.5" fill="#167D9D" filter="url(#glow)"/>
    <circle cx="720" cy="0" r="4.5" fill="#167D9D" filter="url(#glow)"/>
  </g>

  <g class="mono" font-size="13" letter-spacing="1.1">
    <text x="56" y="351" class="muted">FOCUS</text>
    <text x="56" y="376" class="bright">SYSTEMS ENGINEERING</text>

    <text x="356" y="351" class="muted">METHOD</text>
    <text x="356" y="376" class="bright">BUILD · AUTOMATE · ITERATE</text>

    <text x="765" y="351" class="muted">CURRENT SIGNAL</text>
    <text x="765" y="376" class="bright">AI + INFRA + PRODUCT</text>
  </g>

  <g class="fade" opacity=".6">
    <path d="M965 120h122m-92 24h92m-60 24h60" stroke="#167D9D" stroke-opacity=".18"/>
    <circle cx="1113" cy="120" r="3" fill="#167D9D"/>
  </g>
</svg>